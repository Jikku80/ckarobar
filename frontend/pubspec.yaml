name: dentaldb_mobile
description: DentalDB clinic management — mobile app (Flutter, Android & iOS).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Networking — mirrors lib/api.ts on the web app (axios + withCredentials)
  dio: ^5.4.3+1
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  path_provider: ^2.1.3

  # Routing
  go_router: ^14.2.0

  # Local (non-cookie) state persistence — active branch id, etc.
  shared_preferences: ^2.2.3

  # Formatting
  intl: ^0.19.0

  # Pull-to-refresh / nice list states
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/
